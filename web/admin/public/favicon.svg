<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="RouteGate">
  <!-- RouteGate mark: service lanes converge through a gate into one route -->
  <defs>
    <linearGradient id="rg-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3b6cff"/>
      <stop offset="1" stop-color="#1d39c4"/>
    </linearGradient>
  </defs>
  <rect x="2" y="2" width="60" height="60" rx="14" fill="url(#rg-bg)"/>
  <!-- inbound lanes: three callers -->
  <g stroke="#ffffff" stroke-width="4" stroke-linecap="round">
    <line x1="13" y1="17" x2="23" y2="27"/>
    <line x1="13" y1="32" x2="23" y2="32"/>
    <line x1="13" y1="47" x2="23" y2="37"/>
  </g>
  <circle cx="12" cy="16" r="3.2" fill="#ffffff"/>
  <circle cx="12" cy="32" r="3.2" fill="#ffffff"/>
  <circle cx="12" cy="48" r="3.2" fill="#ffffff"/>
  <!-- the gate -->
  <rect x="24.5" y="24.5" width="15" height="15" rx="3.5" transform="rotate(45 32 32)" fill="#ffffff"/>
  <rect x="29.4" y="29.4" width="5.2" height="5.2" rx="1.6" transform="rotate(45 32 32)" fill="#1d39c4"/>
  <!-- outbound route with arrow -->
  <line x1="44" y1="32" x2="50" y2="32" stroke="#ffffff" stroke-width="4" stroke-linecap="round"/>
  <path d="M50 25 L58.5 32 L50 39 Z" fill="#ffffff"/>
</svg>
